[pytest]
# Configure pytest to only collect from tests/ directory
testpaths = tests

# Exclude manual test scripts from collection
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore patterns
norecursedirs = .git .tox dist build *.egg scripts examples

# More verbose output
addopts = -v --tb=short

# Don't collect manual test files even if they match the pattern
collect_ignore =
    manual_test_bisector_mock.py
    manual_test_cli_structure.py
    manual_test_cli_basic.py
    run_patcher_tests.py
