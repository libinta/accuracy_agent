# Configuration for GLM-5.2-FP8 GPU/XPU accuracy testing with vLLM backend

backend: vllm  # Use vLLM backend (vs "pytorch")

model:
  path: /mnt/weka/data/customer-models/GLM-5.2-FP8

gpu:
  host: gpu-host.example.com
  docker: gpu_container_name
  cards: "6,7"
  device_type: cuda
  vllm_path: /workspace/github/gpu/vllm  # vLLM installation path
  user: username
  ssh_key_path: /path/to/.ssh/id_rsa  # Optional: SSH private key path
  # Optional GPU docker automation (see examples/local_xpu_auto_gpu.yaml).
  # Leave `docker` empty and the tool reads the vLLM version out of the XPU
  # container and starts the matching vllm/vllm-openai RELEASE image itself.
  # auto_image: true          # default; false disables the automation
  # image: vllm/vllm-openai:v0.11.0   # pin an image instead of matching versions
  # container_name: my_gpu_container  # name for the auto-launched container
  # docker_run_args: "--network=host" # extra raw `docker run` flags

xpu:
  host: xpu-host.example.com
  docker: xpu_container_name
  cards: "0,1,2,3,4,5,6,7"
  device_type: xpu
  vllm_path: /workspace/github/vllm
  user: root
  ssh_key_path: /path/to/.ssh/id_rsa  # Optional: SSH private key path

shared_fs: /mnt/weka
output_dir: /mnt/weka/accuracy_debug_glm52_vllm

test:
  layer_start: 0
  layer_end: 3  # Test first 3 layers
  prompt: "What is the capital of France?"

# Notes:
# - This tool can run from:
#   1. A control host with SSH access to both GPU and XPU hosts
#   2. Inside one of the docker containers (will use local execution for that backend, SSH for the other)
# - If ssh_key_path is not specified, paramiko will look for keys in default locations
# - When running from inside a docker container, ensure openssh-client is installed
